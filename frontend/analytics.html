<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%232369db%22/%3E%3Cpath d=%22M9 23a5 5 0 0 1 0-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11Z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.6%22/%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — CloudSense AI</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <header class="topbar" id="topbar-root"></header>

  <main class="main-content" id="main-content">
    <div class="page-header">
      <div>
        <h1>Storage Analytics</h1>
        <p class="subtitle">How your Cloud Health Score is calculated, and where your storage is going.</p>
      </div>
    </div>

    <!-- Cloud Health deep-dive -->
    <section class="card mt-24" style="margin-bottom:20px;">
      <div class="section-head">
        <h2>Cloud Health</h2>
        <button class="link-btn" id="howCalculatedBtn">How is this calculated?</button>
      </div>
      <div id="healthDeepDive"></div>
    </section>

    <!-- Charts -->
    <section class="charts-grid">
      <div class="card">
        <div class="section-head">
          <h2>Storage Usage by Category</h2>
          <span class="demo-tag">Live AWS data</span>
        </div>
        <div id="storageBreakdown" class="bar-chart-list"></div>
      </div>

      <div class="card">
        <div class="section-head">
          <h2>Current File Health</h2>
          <span class="demo-tag">Live AWS data</span>
        </div>
        <div id="healthTrendChart"></div>
      </div>
    </section>
    <section class="charts-grid">
      <section class="card"><div class="section-head"><h2>Storage activity</h2><button id="activityDetails" class="link-btn" disabled>View details ↗</button></div><div id="storageActivity">Loading activity…</div></section>
      <section class="card"><div class="section-head"><h2>Storage breakdown</h2><button id="breakdownDetails" class="link-btn">View details ↗</button></div><div id="analyticsDistribution"></div></section>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
