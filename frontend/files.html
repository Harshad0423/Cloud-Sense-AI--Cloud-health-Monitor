<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%232369db%22/%3E%3Cpath d=%22M9 23a5 5 0 0 1 0-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11Z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%221.6%22/%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Files — CloudSense AI</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <header class="topbar" id="topbar-root"></header>

  <main class="main-content" id="main-content">
    <div class="page-header">
      <div>
        <h1>Files</h1>
        <p class="subtitle">All files CloudSense AI is currently monitoring.</p>
      </div>
      <button class="btn btn-primary" id="openUploadBtn">Upload Files</button>
    </div>

    <!-- Upload zone (toggled) -->
    <section class="card" id="uploadSection" style="display:none; margin-bottom:20px;">
      <div class="section-head">
        <h2>Upload Files</h2>
        <button class="link-btn" id="closeUploadBtn">Close</button>
      </div>

      <div class="upload-zone" id="dropZone">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 15V4M8 8l4-4 4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3>Drag &amp; drop files here</h3>
        <p class="or-text">or</p>
        <button class="btn btn-secondary" id="chooseFilesBtn">Choose Files</button>
        <input type="file" id="fileInput" multiple hidden />
        <p class="upload-support">Supported file types: PDF, DOCX, ZIP, MP4, JPG, PNG and more</p>
      </div>

      <div class="upload-progress-list" id="uploadProgressList"></div>
    </section>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-input">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="fileSearchInput" aria-label="Search files" placeholder="Search files by name…" />
      </div>
      <select class="select-input" id="typeFilter" aria-label="File type">
        <option value="all">All types</option>
        <option value="PDF">PDF</option>
        <option value="DOCX">DOCX</option>
        <option value="ZIP">ZIP</option>
        <option value="MP4">MP4</option>
        <option value="JPG">JPG</option>
      </select>
      <select class="select-input" id="statusFilter" aria-label="File status">
        <option value="all">All statuses</option>
        <option value="Healthy">Healthy</option>
        <option value="Duplicate">Duplicate</option>
        <option value="Inactive">Inactive</option>
        <option value="Large">Large</option>
      </select>
      <select class="select-input" id="sortSelect" aria-label="Sort files">
        <option value="name-asc">Sort: Name (A–Z)</option>
        <option value="size-desc">Sort: Size (Largest)</option>
        <option value="size-asc">Sort: Size (Smallest)</option>
      </select>
    </div>

    <!-- Table -->
    <section class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>File Name</th>
              <th>Size</th>
              <th>Type</th>
              <th>Uploaded</th>
              <th>Last Accessed</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="filesTableBody"></tbody>
        </table>
      </div>
      <div id="filesEmptyState"></div>
      <div class="pagination" id="pagination"></div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
<script src="js/ui.js"></script>
<script src="js/files.js"></script>
</body>
</html>
